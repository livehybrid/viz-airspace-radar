name: Splunk App CI/CD

on:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
  workflow_dispatch: {}
  schedule:
    # Weekly re-run of main, so it never goes stale unseen against new
    # Splunk, AppInspect and dependency releases. Tag-only jobs skip it.
    - cron: "22 5 * * 2"

permissions:
  pull-requests: write
  actions: write
  checks: write
  contents: write

# Cancel a superseded run on the same branch or pull request, so CI never
# spends time on code that has already been replaced. The default branch is
# never cancelled: every push there gets its own complete run, because a
# cancelled run on a branch that deploys or releases can let commits go out
# unchecked (haloclock-app, 13 Oct 2026).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  # The Splunk versions CI tests and Splunkbase lists come from one file in
  # livehybrid/deploy-splunk-app-action (splunk-versions.json).
  splunk-versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.v.outputs.matrix }}
    steps:
      - id: v
        uses: livehybrid/deploy-splunk-app-action/splunk-versions@v1

  package:
    # ubuntu-24.04 because ubuntu-latest (26.04) has no Python 3.9.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.9"

      - name: Determine version
        id: version
        uses: livehybrid/deploy-splunk-app-action/app-version@v1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Build visualizations (where a build script exists)
        shell: bash
        run: |
          for d in appserver/static/visualizations/*/; do
            if [ -f "${d}package.json" ] && grep -q '"build"' "${d}package.json"; then
              echo "==> building ${d}"
              ( cd "$d" && npm ci && npm run build )
            else
              echo "==> ${d} has no build script — using committed visualization.js"
            fi
          done

      - name: Stage app
        shell: bash
        run: |
          mkdir -p stage/viz-airspace-radar
          rsync -a \
                --exclude '.git' \
                --exclude '.github' \
                --exclude '.gitignore' \
                --exclude '.gitattributes' \
                --exclude '.editorconfig' \
                --exclude '.prettierrc' \
                --exclude '.babelrc' \
                --exclude 'stage' \
                --exclude 'dist' \
                --exclude 'node_modules' \
                --exclude '*.tar.gz' \
                --exclude '.DS_Store' \
                --exclude 'appserver/static/visualizations/*/src' \
                --exclude 'appserver/static/visualizations/*/webpack.config.js' \
                --exclude 'appserver/static/visualizations/*/package.json' \
                --exclude 'appserver/static/visualizations/*/package-lock.json' \
                --exclude '/tests' \
                --exclude '/e2e' \
                --exclude '/docker' \
                --exclude '/playwright.config.js' \
                --exclude '/package.json' \
                --exclude '/package-lock.json' \
                --exclude 'e2e-results' \
                --exclude '/splunkbase' \
                ./ stage/viz-airspace-radar/
          ls -la stage/viz-airspace-radar/

      - name: Package
        # Stamps the version and build = MAJ*10000+MIN*100+PATCH (every release
        # must change build, or browsers keep the old cached JS), normalises
        # permissions (AppInspect rejects 775/664), checks any bundled certifi,
        # writes the tarball and verifies the tarball itself against a version
        # recomputed from the ref and git.
        uses: livehybrid/deploy-splunk-app-action/app-package@v1
        with:
          app-dir: stage/viz-airspace-radar
          version-with-hash: ${{ steps.version.outputs.VERSION_WITH_HASH }}
          build: ${{ steps.version.outputs.BUILD }}

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Upload stage directory for inspection
        uses: actions/upload-artifact@v7
        with:
          name: stage-contents
          path: stage/viz-airspace-radar/

  unit-test:
    name: unit-test (jest render + config)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Run jest
        run: |
          npm ci
          npm test

  e2e-playwright:
    name: e2e-playwright (real Splunk render)
    needs: [package, splunk-versions]
    # Dependabot actors get no secrets/egress guarantees; unit + appinspect still cover them.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 10.4 (the first Splunk with studio_visualization) and the newest 10.6.
        splunk: ${{ fromJSON(needs.splunk-versions.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Free runner disk
        uses: livehybrid/deploy-splunk-app-action/splunk-docker/free-disk@v1
      - name: Download staged app
        uses: actions/download-artifact@v8
        with:
          name: stage-contents
          path: stage-app
      - name: Start Splunk (wait for health)
        # The container's splunk user (another uid) only reads the viz: 755.
        uses: livehybrid/deploy-splunk-app-action/splunk-docker/start@v1
        env:
          APP_DIR: ${{ github.workspace }}/stage-app
        with:
          version: ${{ matrix.splunk }}
          app-dir: stage-app
          app-dir-mode: "755"
          wait-timeout: "420"
      - name: Run e2e render check
        uses: livehybrid/deploy-splunk-app-action/playwright@v1
        env:
          SPLUNK_WEB_URL: http://localhost:8000
          SPLUNK_MGMT_URL: https://localhost:8089
          SPLUNK_USER: admin
          SPLUNK_PASSWORD: Changeme1!
        with:
          working-directory: .
          artifact-name: e2e-render-${{ matrix.splunk }}
          results-path: e2e-results/
      - name: Splunk logs on failure
        if: failure()
        uses: livehybrid/deploy-splunk-app-action/splunk-docker/logs@v1
        with:
          container: viz_radar_splunk
          tail: "200"
      - name: Tear down
        if: always()
        uses: livehybrid/deploy-splunk-app-action/splunk-docker/teardown@v1

  appinspect:
    name: quality-appinspect
    needs: package
    uses: livehybrid/deploy-splunk-app-action/.github/workflows/appinspect-cli.yml@v1
    with:
      tags: "cloud,future,private_victoria"
    secrets:
      token: "${{ secrets.GITHUB_TOKEN }}"

  quality-appinspect-api:
    name: quality-appinspect-api
    needs:
      - appinspect
    uses: livehybrid/deploy-splunk-app-action/.github/workflows/appinspect-api.yml@v1
    secrets:
      splunkbase_username: ${{ secrets.SPLUNKBASE_USERNAME }}
      splunkbase_password: ${{ secrets.SPLUNKBASE_PASSWORD }}

  publish-gh:
    permissions:
      contents: write
    needs:
      - appinspect
      - unit-test
      - e2e-playwright
    uses: livehybrid/deploy-splunk-app-action/.github/workflows/publish.yml@v1

  publish-splunkbase:
    # Tag runs only: needs the GitHub release (every CLI gate + e2e) and
    # Splunk's hosted AppInspect. Uploads stay off until the repo variable
    # SPLUNKBASE_PUBLISH_ENABLED=true. The compatibility list is the shared
    # splunk-versions.json, the same file the e2e matrix uses.
    needs:
      - publish-gh
      - quality-appinspect-api
    permissions:
      contents: read
    uses: livehybrid/deploy-splunk-app-action/.github/workflows/publish-splunkbase.yml@v1
    with:
      app_id: "8813"
    secrets:
      splunkbase_username: ${{ secrets.SPLUNKBASE_USERNAME }}
      splunkbase_password: ${{ secrets.SPLUNKBASE_PASSWORD }}
